name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libc6-i386 lib32stdc++6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

